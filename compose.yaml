name: shelf

services:
  shelf:
    build: .
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      NODE_ENV: production
      PORT: 3000
      DATA_DIR: /data
      SESSION_DAYS: 30
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - shelf-data:/data
    security_opt:
      - no-new-privileges:true

volumes:
  shelf-data:
    name: shelf-data
